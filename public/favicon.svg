<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Midnight Indigo / Electric Obsidian -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111328"/>
      <stop offset="50%" stop-color="#080a18"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <!-- Electric Bolt Gradient: Pure Gold to High-Voltage Amber -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Electric Cyan / Lightning Aura Gradient -->
    <linearGradient id="electric-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bolt-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Electric Border -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>
  <rect x="3" y="3" width="506" height="506" rx="117" fill="none" stroke="url(#electric-glow)" stroke-width="4.5" stroke-opacity="0.5"/>

  <!-- Radial Glow Behind the Bolt -->
  <circle cx="256" cy="256" r="150" fill="#facc15" opacity="0.14" filter="blur(32px)"/>

  <!-- Stylized Lightning Bolt + Play Icon -->
  <g id="bolt-icon" filter="url(#bolt-bloom)">
    <!-- Aerodynamic High-Voltage Lightning Bolt -->
    <polygon points="290,70 170,270 260,270 210,442 355,230 265,230" fill="url(#bolt-grad)" />

    <!-- Play Arrow Accent inside Lightning Core -->
    <polygon points="248,220 292,250 248,280" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Spark Accent Dots -->
  <circle cx="290" cy="70" r="5" fill="#fef08a" opacity="0.95"/>
  <circle cx="210" cy="442" r="5" fill="#f59e0b" opacity="0.95"/>
</svg>
